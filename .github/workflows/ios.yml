name: WebMic iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: webmic-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build iPhone app without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/WebMic.xcodeproj -target WebMic \
            -configuration Release -sdk iphoneos \
            "CONFIGURATION_BUILD_DIR=$RUNNER_TEMP/webmic-build" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package and verify IPA
        run: |
          app="$RUNNER_TEMP/webmic-build/WebMic.app"
          test -x "$app/WebMic"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$app/Info.plist")" = audio
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = net.weneten.webmic
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/WebMic.app"
          cd "$RUNNER_TEMP/package"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/WebMic.ipa"
          unzip -t "$GITHUB_WORKSPACE/WebMic.ipa"


      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-build-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq WebMic.ipa; then
            exit 0
          fi
          gh release create "$tag" WebMic.ipa \
            --target "$GITHUB_SHA" --title "WebMic iOS – Build $GITHUB_RUN_NUMBER" \
            --notes "Unsignierte IPA für SideStore. iOS 17 oder neuer. Commit: $GITHUB_SHA" \
            --latest

      - name: Remove legacy IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/14763734750"
